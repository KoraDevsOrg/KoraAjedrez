<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#23140a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Ajedrez Clásico</title>
  
  <link rel="manifest" href="./manifest.json">

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
      margin: 0;
      padding: 0;
    }

    body {
      background: radial-gradient(circle at center, #2e1c10 0%, #120904 100%);
      color: #f7e7ce;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      min-height: 100vh;
      min-height: 100dvh;
      padding: env(safe-area-inset-top, 10px) 10px env(safe-area-inset-bottom, 10px) 10px;
    }

    header {
      width: 100%;
      max-width: 440px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 12px;
      background: rgba(43, 27, 17, 0.95);
      border: 1px solid #633f24;
      border-radius: 10px;
      margin-bottom: 6px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.5);
    }

    .status-text {
      font-size: 1.05rem;
      font-weight: bold;
      color: #ffebcd;
    }

    .status-sub {
      font-size: 0.75rem;
      color: #c49c74;
    }

    .btn-header {
      background: #4a2813;
      color: #fff;
      border: 1px solid #8d562c;
      padding: 6px 12px;
      border-radius: 6px;
      font-weight: bold;
      font-size: 0.85rem;
      cursor: pointer;
    }

    #install-banner {
      display: none;
      width: 100%;
      max-width: 440px;
      background: #2e7d32;
      color: #ffffff;
      padding: 10px;
      border-radius: 8px;
      text-align: center;
      margin-bottom: 6px;
      font-weight: bold;
      cursor: pointer;
      border: 1px solid #4caf50;
    }

    #board-frame {
      width: 100%;
      max-width: 440px;
      aspect-ratio: 1 / 1;
      background: linear-gradient(135deg, #422515, #221209);
      padding: 8px;
      border-radius: 12px;
      border: 3px solid #6b4021;
      box-shadow: 0 10px 25px rgba(0,0,0,0.8), inset 0 0 10px rgba(0,0,0,0.7);
    }

    #board {
      width: 100%;
      height: 100%;
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      grid-template-rows: repeat(8, 1fr);
      border: 2px solid #1a0e07;
      border-radius: 4px;
      overflow: hidden;
    }

    .square {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(30px, 9.5vw, 46px);
      line-height: 1;
      cursor: pointer;
      position: relative;
    }

    .light { background-color: #eed9b3; }
    .dark { background-color: #9c6c44; }
    .selected { background-color: #7fac72 !important; }
    .in-check { background-color: #c94a4a !important; }

    .hint::after {
      content: "";
      width: 28%;
      height: 28%;
      background: rgba(46, 125, 50, 0.75);
      border-radius: 50%;
      position: absolute;
    }

    .hint.capture::after {
      width: 72%;
      height: 72%;
      background: transparent;
      border: 4px solid rgba(211, 47, 47, 0.85);
      border-radius: 50%;
    }

    .panel-config {
      width: 100%;
      max-width: 440px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
      margin: 6px 0;
    }

    .color-picker {
      display: flex;
      background: #2b180d;
      border: 1px solid #57331c;
      border-radius: 8px;
      overflow: hidden;
    }

    .color-btn {
      padding: 7px 12px;
      background: transparent;
      color: #cfb39b;
      border: none;
      font-size: 0.85rem;
      font-weight: bold;
      cursor: pointer;
    }

    .color-btn.active {
      background: #8b4513;
      color: #fff;
    }

    .controls {
      display: flex;
      gap: 4px;
      flex: 1;
      justify-content: flex-end;
    }

    .lvl-btn {
      padding: 7px 8px;
      background: #2b180d;
      color: #cfb39b;
      border: 1px solid #57331c;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: bold;
      cursor: pointer;
    }

    .lvl-btn.active {
      background: #8b4513;
      color: #ffffff;
      border-color: #ff9800;
    }

    .actions {
      width: 100%;
      max-width: 440px;
      display: flex;
      gap: 10px;
      margin-bottom: 4px;
    }

    .btn {
      flex: 1;
      padding: 12px;
      background: linear-gradient(180deg, #61361c, #3d2010);
      color: #ffffff;
      border: 1px solid #94572e;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 6px rgba(0,0,0,0.4);
    }

    .btn:active { transform: translateY(2px); }

    /* MODAL */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.85);
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .modal-content {
      background: #2a170d;
      border: 2px solid #8d562c;
      border-radius: 12px;
      max-width: 400px;
      width: 100%;
      padding: 18px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.9);
    }

    .modal-title {
      font-size: 1.25rem;
      font-weight: bold;
      color: #ffebcd;
      margin-bottom: 14px;
    }

    .slot-card {
      background: #1c0e07;
      border: 1px solid #57331c;
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .slot-info { text-align: left; }
    .slot-info h4 { font-size: 0.95rem; color: #ffca80; }
    .slot-info p { font-size: 0.8rem; color: #b89b82; }

    .btn-slot {
      padding: 8px 12px;
      font-size: 0.85rem;
      font-weight: bold;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      margin-left: 4px;
    }

    .btn-load { background: #2e7d32; color: #fff; }
    .btn-save { background: #b26a00; color: #fff; }
  </style>
</head>
<body>

  <div id="install-banner" onclick="instalarApp()">
    📲 Toca aquí para instalar el juego en tu celular
  </div>

  <header>
    <div>
      <div id="status" class="status-text">Tu turno</div>
      <div id="slot-indicator" class="status-sub">Partida 1</div>
    </div>
    <button class="btn-header" onclick="abrirModal()">💾 Partidas</button>
  </header>

  <div id="board-frame">
    <div id="board"></div>
  </div>

  <div class="panel-config">
    <div class="color-picker">
      <button id="btn-w" class="color-btn active" onclick="cambiarColorJugador('w')">Blancas</button>
      <button id="btn-b" class="color-btn" onclick="cambiarColorJugador('b')">Negras</button>
    </div>
    <div class="controls">
      <button class="lvl-btn active" onclick="setDiff(1)">Fácil</button>
      <button class="lvl-btn" onclick="setDiff(2)">Medio</button>
      <button class="lvl-btn" onclick="setDiff(3)">Difícil</button>
      <button class="lvl-btn" onclick="setDiff(4)">Maestro</button>
    </div>
  </div>

  <div class="actions">
    <button class="btn" onclick="deshacer()">↩ Deshacer</button>
    <button class="btn" onclick="reiniciarPartida()">🔄 Nueva Partida</button>
  </div>

  <!-- MODAL DE GUARDADO -->
  <div id="slots-modal" class="modal">
    <div class="modal-content">
      <div class="modal-title">Gestión de Partidas</div>
      
      <div class="slot-card">
        <div class="slot-info">
          <h4>Partida 1</h4>
          <p id="info-slot-1">Vacía</p>
        </div>
        <div>
          <button class="btn-slot btn-save" onclick="guardarRanura(1)">Guardar</button>
          <button class="btn-slot btn-load" onclick="cargarRanura(1)">Cargar</button>
        </div>
      </div>

      <div class="slot-card">
        <div class="slot-info">
          <h4>Partida 2</h4>
          <p id="info-slot-2">Vacía</p>
        </div>
        <div>
          <button class="btn-slot btn-save" onclick="guardarRanura(2)">Guardar</button>
          <button class="btn-slot btn-load" onclick="cargarRanura(2)">Cargar</button>
        </div>
      </div>

      <div class="slot-card">
        <div class="slot-info">
          <h4>Partida 3</h4>
          <p id="info-slot-3">Vacía</p>
        </div>
        <div>
          <button class="btn-slot btn-save" onclick="guardarRanura(3)">Guardar</button>
          <button class="btn-slot btn-load" onclick="cargarRanura(3)">Cargar</button>
        </div>
      </div>

      <button class="btn" style="margin-top: 10px; width: 100%;" onclick="cerrarModal()">Cerrar</button>
    </div>
  </div>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      });
    }

    let deferredPrompt = null;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      document.getElementById('install-banner').style.display = 'block';
    });

    function instalarApp() {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        deferredPrompt.userChoice.then(() => {
          document.getElementById('install-banner').style.display = 'none';
          deferredPrompt = null;
        });
      }
    }

    // --- AUDIO SINTÉTICO ---
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let actx = null;
    function playSound(isCapture) {
      try {
        if (!actx) actx = new AudioCtx();
        if (actx.state === 'suspended') actx.resume();
        const osc = actx.createOscillator();
        const gain = actx.createGain();
        osc.frequency.setValueAtTime(isCapture ? 120 : 210, actx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(30, actx.currentTime + 0.08);
        gain.gain.setValueAtTime(0.35, actx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, actx.currentTime + 0.08);
        osc.connect(gain);
        gain.connect(actx.destination);
        osc.start();
        osc.stop(actx.currentTime + 0.08);
      } catch (e) {}
    }

    const SYMBOLS = {
      'r': '♜', 'n': '♞', 'b': '♝', 'q': '♛', 'k': '♚', 'p': '♟',
      'R': '♖', 'N': '♘', 'B': '♗', 'Q': '♕', 'K': '♔', 'P': '♙'
    };

    // Tablas PeSTO para evaluación posicional de ajedrez
    const PST = {
      p: [
        [0,  0,  0,  0,  0,  0,  0,  0],
        [50, 50, 50, 50, 50, 50, 50, 50],
        [10, 10, 20, 30, 30, 20, 10, 10],
        [5,  5, 10, 25, 25, 10,  5,  5],
        [0,  0,  0, 20, 20,  0,  0,  0],
        [5, -5,-10,  0,  0,-10, -5,  5],
        [5, 10, 10,-20,-20, 10, 10,  5],
        [0,  0,  0,  0,  0,  0,  0,  0]
      ],
      n: [
        [-50,-40,-30,-30,-30,-30,-40,-50],
        [-40,-20,  0,  0,  0,  0,-20,-40],
        [-30,  0, 10, 15, 15, 10,  0,-30],
        [-30,  5, 15, 20, 20, 15,  5,-30],
        [-30,  0, 15, 20, 20, 15,  0,-30],
        [-30,  5, 10, 15, 15, 10,  5,-30],
        [-40,-20,  0,  5,  5,  0,-20,-40],
        [-50,-40,-30,-30,-30,-30,-40,-50]
      ],
      b: [
        [-20,-10,-10,-10,-10,-10,-10,-20],
        [-10,  0,  0,  0,  0,  0,  0,-10],
        [-10,  0,  5, 10, 10,  5,  0,-10],
        [-10,  5,  5, 10, 10,  5,  5,-10],
        [-10,  0, 10, 10, 10, 10,  0,-10],
        [-10, 10, 10, 10, 10, 10, 10,-10],
        [-10,  5,  0,  0,  0,  0,  5,-10],
        [-20,-10,-10,-10,-10,-10,-10,-20]
      ],
      r: [
        [0,  0,  0,  0,  0,  0,  0,  0],
        [5, 10, 10, 10, 10, 10, 10,  5],
        [-5,  0,  0,  0,  0,  0,  0, -5],
        [-5,  0,  0,  0,  0,  0,  0, -5],
        [-5,  0,  0,  0,  0,  0,  0, -5],
        [-5,  0,  0,  0,  0,  0,  0, -5],
        [-5,  0,  0,  0,  0,  0,  0, -5],
        [0,  0,  0,  5,  5,  0,  0,  0]
      ],
      q: [
        [-20,-10,-10, -5, -5,-10,-10,-20],
        [-10,  0,  0,  0,  0,  0,  0,-10],
        [-10,  0,  5,  5,  5,  5,  0,-10],
        [-5,  0,  5,  5,  5,  5,  0, -5],
        [0,  0,  5,  5,  5,  5,  0, -5],
        [-10,  5,  5,  5,  5,  5,  0,-10],
        [-10,  0,  5,  0,  0,  0,  0,-10],
        [-20,-10,-10, -5, -5,-10,-10,-20]
      ],
      k: [
        [-30,-40,-40,-50,-50,-40,-40,-30],
        [-30,-40,-40,-50,-50,-40,-40,-30],
        [-30,-40,-40,-50,-50,-40,-40,-30],
        [-30,-40,-40,-50,-50,-40,-40,-30],
        [-20,-30,-30,-40,-40,-30,-30,-20],
        [-10,-20,-20,-20,-20,-20,-20,-10],
        [20, 20,  0,  0,  0,  0, 20, 20],
        [20, 30, 10,  0,  0, 10, 30, 20]
      ]
    };

    const PIECE_VALS = { 'p': 100, 'n': 320, 'b': 330, 'r': 500, 'q': 900, 'k': 20000 };

    let gameState = {
      board: [
        ['r','n','b','q','k','b','n','r'],
        ['p','p','p','p','p','p','p','p'],
        ['','','','','','','',''],
        ['','','','','','','',''],
        ['','','','','','','',''],
        ['','','','','','','',''],
        ['P','P','P','P','P','P','P','P'],
        ['R','N','B','Q','K','B','N','R']
      ],
      turn: 'w',
      castling: { w: { k: true, q: true }, b: { k: true, q: true } },
      enPassant: null,
      history: []
    };

    let playerColor = 'w';
    let difficulty = 1;
    let selectedSquare = null;
    let validMoves = [];
    let isGameOver = false;
    let currentSlot = 1;

    const boardElem = document.getElementById("board");
    const statusElem = document.getElementById("status");
    const slotIndicator = document.getElementById("slot-indicator");

    function isWhite(p) { return p !== '' && p === p.toUpperCase(); }
    function isBlack(p) { return p !== '' && p === p.toLowerCase(); }
    function getPieceColor(p) { return !p ? null : (isWhite(p) ? 'w' : 'b'); }

    // Generador pseudo-legal
    function generatePseudoMoves(state, color) {
      const moves = [];
      const b = state.board;
      const isW = color === 'w';

      for (let r = 0; r < 8; r++) {
        for (let c = 0; c < 8; c++) {
          const p = b[r][c];
          if (!p || getPieceColor(p) !== color) continue;
          const type = p.toLowerCase();

          if (type === 'p') {
            const dir = isW ? -1 : 1;
            const startRow = isW ? 6 : 1;
            const nextR = r + dir;
            if (nextR >= 0 && nextR < 8 && b[nextR][c] === '') {
              moves.push({ from: { r, c }, to: { r: nextR, c } });
              if (r === startRow && b[r + dir * 2][c] === '') {
                moves.push({ from: { r, c }, to: { r: r + dir * 2, c }, doublePawn: true });
              }
            }
            // Capturas
            [-1, 1].forEach(dc => {
              const nc = c + dc;
              if (nextR >= 0 && nextR < 8 && nc >= 0 && nc < 8) {
                if (b[nextR][nc] && getPieceColor(b[nextR][nc]) !== color) {
                  moves.push({ from: { r, c }, to: { r: nextR, c: nc } });
                } else if (state.enPassant && state.enPassant.r === nextR && state.enPassant.c === nc) {
                  moves.push({ from: { r, c }, to: { r: nextR, c: nc }, isEnPassant: true });
                }
              }
            });
          }

          if (type === 'n') {
            [[-2,-1],[-2,1],[-1,-2],[-1,2],[1,-2],[1,2],[2,-1],[2,1]].forEach(([dr, dc]) => {
              const nr = r + dr, nc = c + dc;
              if (nr >= 0 && nr < 8 && nc >= 0 && nc < 8) {
                if (!b[nr][nc] || getPieceColor(b[nr][nc]) !== color) {
                  moves.push({ from: { r, c }, to: { r: nr, c: nc } });
                }
              }
            });
          }

          if (type === 'b' || type === 'r' || type === 'q') {
            const dirs = [];
            if (type === 'b' || type === 'q') dirs.push([-1,-1],[-1,1],[1,-1],[1,1]);
            if (type === 'r' || type === 'q') dirs.push([-1,0],[1,0],[0,-1],[0,1]);

            dirs.forEach(([dr, dc]) => {
              let step = 1;
              while (true) {
                const nr = r + dr * step, nc = c + dc * step;
                if (nr < 0 || nr >= 8 || nc < 0 || nc >= 8) break;
                if (!b[nr][nc]) {
                  moves.push({ from: { r, c }, to: { r: nr, c: nc } });
                } else {
                  if (getPieceColor(b[nr][nc]) !== color) {
                    moves.push({ from: { r, c }, to: { r: nr, c: nc } });
                  }
                  break;
                }
                step++;
              }
            });
          }

          if (type === 'k') {
            for (let dr = -1; dr <= 1; dr++) {
              for (let dc = -1; dc <= 1; dc++) {
                if (dr === 0 && dc === 0) continue;
                const nr = r + dr, nc = c + dc;
                if (nr >= 0 && nr < 8 && nc >= 0 && nc < 8) {
                  if (!b[nr][nc] || getPieceColor(b[nr][nc]) !== color) {
                    moves.push({ from: { r, c }, to: { r: nr, c: nc } });
                  }
                }
              }
            }
            // Enroque
            const row = isW ? 7 : 0;
            if (r === row && c === 4) {
              if (state.castling[color].k && b[row][5] === '' && b[row][6] === '') {
                if (!isSquareAttacked(state, row, 4, color) && !isSquareAttacked(state, row, 5, color)) {
                  moves.push({ from: { r, c }, to: { r: row, c: 6 }, isCastleK: true });
                }
              }
              if (state.castling[color].q && b[row][3] === '' && b[row][2] === '' && b[row][1] === '') {
                if (!isSquareAttacked(state, row, 4, color) && !isSquareAttacked(state, row, 3, color)) {
                  moves.push({ from: { r, c }, to: { r: row, c: 2 }, isCastleQ: true });
                }
              }
            }
          }
        }
      }
      return moves;
    }

    function isSquareAttacked(state, targetR, targetC, defendColor) {
      const b = state.board;
      const attackColor = defendColor === 'w' ? 'b' : 'w';
      const isAttackerW = attackColor === 'w';

      // Ataques de peón
      const pawnDir = isAttackerW ? 1 : -1;
      for (const dc of [-1, 1]) {
        const pr = targetR + pawnDir, pc = targetC + dc;
        if (pr >= 0 && pr < 8 && pc >= 0 && pc < 8) {
          const p = b[pr][pc];
          if (p && getPieceColor(p) === attackColor && p.toLowerCase() === 'p') return true;
        }
      }

      // Caballos
      const knightD = [[-2,-1],[-2,1],[-1,-2],[-1,2],[1,-2],[1,2],[2,-1],[2,1]];
      for (const [dr, dc] of knightD) {
        const nr = targetR + dr, nc = targetC + dc;
        if (nr >= 0 && nr < 8 && nc >= 0 && nc < 8) {
          const p = b[nr][nc];
          if (p && getPieceColor(p) === attackColor && p.toLowerCase() === 'n') return true;
        }
      }

      // Rey
      for (let dr = -1; dr <= 1; dr++) {
        for (let dc = -1; dc <= 1; dc++) {
          if (dr === 0 && dc === 0) continue;
          const nr = targetR + dr, nc = targetC + dc;
          if (nr >= 0 && nr < 8 && nc >= 0 && nc < 8) {
            const p = b[nr][nc];
            if (p && getPieceColor(p) === attackColor && p.toLowerCase() === 'k') return true;
          }
        }
      }

      // Líneas rectas / diagonales
      const dirs = [
        [-1,0,'r'],[1,0,'r'],[0,-1,'r'],[0,1,'r'],
        [-1,-1,'b'],[-1,1,'b'],[1,-1,'b'],[1,1,'b']
      ];
      for (const [dr, dc, req] of dirs) {
        let step = 1;
        while (true) {
          const nr = targetR + dr * step, nc = targetC + dc * step;
          if (nr < 0 || nr >= 8 || nc < 0 || nc >= 8) break;
          const p = b[nr][nc];
          if (p) {
            if (getPieceColor(p) === attackColor) {
              const t = p.toLowerCase();
              if (t === 'q' || t === req) return true;
            }
            break;
          }
          step++;
        }
      }
      return false;
    }

    function findKing(state, color) {
      const target = color === 'w' ? 'K' : 'k';
      for (let r = 0; r < 8; r++) {
        for (let c = 0; c < 8; c++) {
          if (state.board[r][c] === target) return { r, c };
        }
      }
      return null;
    }

    function isKingInCheck(state, color) {
      const kingPos = findKing(state, color);
      if (!kingPos) return false;
      return isSquareAttacked(state, kingPos.r, kingPos.c, color);
    }

    function applyMoveClone(state, move) {
      const next = {
        board: state.board.map(row => [...row]),
        turn: state.turn === 'w' ? 'b' : 'w',
        castling: {
          w: { ...state.castling.w },
          b: { ...state.castling.b }
        },
        enPassant: null
      };

      const p = next.board[move.from.r][move.from.c];
      next.board[move.to.r][move.to.c] = p;
      next.board[move.from.r][move.from.c] = '';

      // Enroque
      if (move.isCastleK) {
        next.board[move.to.r][5] = next.board[move.to.r][7];
        next.board[move.to.r][7] = '';
      }
      if (move.isCastleQ) {
        next.board[move.to.r][3] = next.board[move.to.r][0];
        next.board[move.to.r][0] = '';
      }

      // En Passant
      if (move.isEnPassant) {
        const pawnRow = state.turn === 'w' ? move.to.r + 1 : move.to.r - 1;
        next.board[pawnRow][move.to.c] = '';
      }
      if (move.doublePawn) {
        next.enPassant = { r: (move.from.r + move.to.r) / 2, c: move.from.c };
      }

      // Promoción automática a Reina
      if (p === 'P' && move.to.r === 0) next.board[move.to.r][move.to.c] = 'Q';
      if (p === 'p' && move.to.r === 7) next.board[move.to.r][move.to.c] = 'q';

      // Actualizar derechos de enroque
      if (p === 'K') next.castling.w = { k: false, q: false };
      if (p === 'k') next.castling.b = { k: false, q: false };
      if (move.from.r === 7 && move.from.c === 7) next.castling.w.k = false;
      if (move.from.r === 7 && move.from.c === 0) next.castling.w.q = false;
      if (move.from.r === 0 && move.from.c === 7) next.castling.b.k = false;
      if (move.from.r === 0 && move.from.c === 0) next.castling.b.q = false;

      return next;
    }

    // Reglas FIDE: Generar solo jugadas estrictamente legales (no dejan el rey en jaque)
    function generateLegalMoves(state, color) {
      const pseudo = generatePseudoMoves(state, color);
      const legal = [];
      for (const m of pseudo) {
        const nextState = applyMoveClone(state, m);
        if (!isKingInCheck(nextState, color)) {
          legal.push(m);
        }
      }
      return legal;
    }

    // --- RENDERIZADO DEL TABLERO ---
    function renderBoard() {
      boardElem.innerHTML = '';
      const isCheckCurrent = isKingInCheck(gameState, gameState.turn);
      const kingPos = findKing(gameState, gameState.turn);

      // Si el jugador eligió Negras, invertimos la vista del tablero
      for (let i = 0; i < 8; i++) {
        for (let j = 0; j < 8; j++) {
          const r = playerColor === 'w' ? i : 7 - i;
          const c = playerColor === 'w' ? j : 7 - j;

          const sq = document.createElement("div");
          sq.className = `square ${(r + c) % 2 === 0 ? 'light' : 'dark'}`;

          const piece = gameState.board[r][c];
          if (piece) {
            sq.textContent = SYMBOLS[piece];
            sq.style.color = isWhite(piece) ? '#ffffff' : '#140c06';
            sq.style.textShadow = isWhite(piece) ? '0 1px 3px #000' : '0 1px 1px rgba(255,255,255,0.4)';
          }

          if (isCheckCurrent && kingPos && kingPos.r === r && kingPos.c === c) {
            sq.classList.add("in-check");
          }

          if (selectedSquare && selectedSquare.r === r && selectedSquare.c === c) {
            sq.classList.add("selected");
          }

          const move = validMoves.find(m => m.to.r === r && m.to.c === c);
          if (move) {
            sq.classList.add("hint");
            if (gameState.board[r][c] !== '' || move.isEnPassant) sq.classList.add("capture");
          }

          sq.addEventListener("click", () => handleSquareClick(r, c));
          boardElem.appendChild(sq);
        }
      }
    }

    function handleSquareClick(r, c) {
      if (isGameOver || gameState.turn !== playerColor) return;
      const piece = gameState.board[r][c];

      if (selectedSquare) {
        const move = validMoves.find(m => m.to.r === r && m.to.c === c);
        if (move) {
          ejecutarJugada(move);
          selectedSquare = null;
          validMoves = [];
          renderBoard();
          checkGameStateEnd();
          if (!isGameOver) {
            setTimeout(turnoIA, 250);
          }
          return;
        }
      }

      if (piece && getPieceColor(piece) === playerColor) {
        selectedSquare = { r, c };
        const allLegal = generateLegalMoves(gameState, playerColor);
        validMoves = allLegal.filter(m => m.from.r === r && m.from.c === c);
        renderBoard();
      } else {
        selectedSquare = null;
        validMoves = [];
        renderBoard();
      }
    }

    function ejecutarJugada(move) {
      const isCapture = gameState.board[move.to.r][move.to.c] !== '' || move.isEnPassant;
      gameState.history.push(JSON.parse(JSON.stringify(gameState)));
      gameState = applyMoveClone(gameState, move);
      playSound(isCapture);
      autoGuardarSlot();
    }

    function checkGameStateEnd() {
      const legalMoves = generateLegalMoves(gameState, gameState.turn);
      const inCheck = isKingInCheck(gameState, gameState.turn);

      if (legalMoves.length === 0) {
        isGameOver = true;
        if (inCheck) {
          const winner = gameState.turn === 'w' ? 'Negras' : 'Blancas';
          statusElem.textContent = `¡Jaque Mate! Ganan las ${winner}`;
        } else {
          statusElem.textContent = "Tablas por Rey Ahogado (Empate)";
        }
        return true;
      }

      if (inCheck) {
        statusElem.textContent = `¡Jaque! Turno de ${gameState.turn === 'w' ? 'Blancas' : 'Negras'}`;
      } else {
        statusElem.textContent = gameState.turn === playerColor ? "Tu turno" : "Pensando...";
      }
      return false;
    }

    // --- EVALUACIÓN POSICIONAL Y MOTOR DE IA ---
    function evaluateBoard(state) {
      let score = 0;
      for (let r = 0; r < 8; r++) {
        for (let c = 0; c < 8; c++) {
          const p = state.board[r][c];
          if (!p) continue;
          const type = p.toLowerCase();
          const val = PIECE_VALS[type] || 0;
          
          let pstScore = 0;
          if (PST[type]) {
            pstScore = isWhite(p) ? PST[type][r][c] : PST[type][7 - r][c];
          }

          if (isWhite(p)) {
            score += (val + pstScore);
          } else {
            score -= (val + pstScore);
          }
        }
      }
      return score;
    }

    function minimax(state, depth, alpha, beta, isMaximizing) {
      if (depth === 0) return evaluateBoard(state);

      const color = isMaximizing ? 'w' : 'b';
      const moves = generateLegalMoves(state, color);

      if (moves.length === 0) {
        if (isKingInCheck(state, color)) {
          return isMaximizing ? -99999 + (4 - depth) : 99999 - (4 - depth);
        }
        return 0; // Tablas
      }

      // Ordenar capturas primero para optimizar la poda alfa-beta
      moves.sort((a, b) => (state.board[b.to.r][b.to.c] ? 1 : 0) - (state.board[a.to.r][a.to.c] ? 1 : 0));

      if (isMaximizing) {
        let maxEval = -Infinity;
        for (const m of moves) {
          const next = applyMoveClone(state, m);
          const ev = minimax(next, depth - 1, alpha, beta, false);
          maxEval = Math.max(maxEval, ev);
          alpha = Math.max(alpha, ev);
          if (beta <= alpha) break;
        }
        return maxEval;
      } else {
        let minEval = Infinity;
        for (const m of moves) {
          const next = applyMoveClone(state, m);
          const ev = minimax(next, depth - 1, alpha, beta, true);
          minEval = Math.min(minEval, ev);
          beta = Math.min(beta, ev);
          if (beta <= alpha) break;
        }
        return minEval;
      }
    }

    function turnoIA() {
      if (isGameOver) return;
      const aiColor = playerColor === 'w' ? 'b' : 'w';
      const moves = generateLegalMoves(gameState, aiColor);

      if (moves.length === 0) {
        checkGameStateEnd();
        renderBoard();
        return;
      }

      let bestMove = null;

      if (difficulty === 1) {
        // Nivel Fácil: Aleatorio pero evita capturas autodestructivas inmediatas
        bestMove = moves[Math.floor(Math.random() * moves.length)];
      } else if (difficulty === 2) {
        // Nivel Medio: Profundidad 1 evaluando material y casillas seguras
        let bestScore = aiColor === 'w' ? -Infinity : Infinity;
        for (const m of moves) {
          const next = applyMoveClone(gameState, m);
          const score = evaluateBoard(next);
          if (aiColor === 'w' ? score > bestScore : score < bestScore) {
            bestScore = score;
            bestMove = m;
          }
        }
      } else if (difficulty === 3) {
        // Nivel Difícil: Minimax Profundidad 2 con Alfa-Beta
        let bestVal = aiColor === 'w' ? -Infinity : Infinity;
        for (const m of moves) {
          const next = applyMoveClone(gameState, m);
          const val = minimax(next, 2, -Infinity, Infinity, aiColor === 'b');
          if (aiColor === 'w' ? val > bestVal : val < bestVal) {
            bestVal = val;
            bestMove = m;
          }
        }
      } else {
        // Nivel Maestro: Minimax Profundidad 3 con Tablas PeSTO
        let bestVal = aiColor === 'w' ? -Infinity : Infinity;
        for (const m of moves) {
          const next = applyMoveClone(gameState, m);
          const val = minimax(next, 3, -Infinity, Infinity, aiColor === 'b');
          if (aiColor === 'w' ? val > bestVal : val < bestVal) {
            bestVal = val;
            bestMove = m;
          }
        }
      }

      if (bestMove) {
        ejecutarJugada(bestMove);
        checkGameStateEnd();
        renderBoard();
      }
    }

    function cambiarColorJugador(color) {
      if (gameState.history.length > 0) {
        if (!confirm("Cambiar de color reiniciará la partida en curso. ¿Deseas continuar?")) return;
      }
      playerColor = color;
      document.getElementById('btn-w').classList.toggle('active', color === 'w');
      document.getElementById('btn-b').classList.toggle('active', color === 'b');
      reiniciarPartida();
    }

    function deshacer() {
      if (gameState.history.length >= 2) {
        // Deshace la jugada de la IA y del jugador
        gameState.history.pop();
        gameState = gameState.history.pop();
      } else if (gameState.history.length === 1) {
        gameState = gameState.history.pop();
      }
      isGameOver = false;
      selectedSquare = null;
      validMoves = [];
      checkGameStateEnd();
      renderBoard();
      autoGuardarSlot();
    }

    function reiniciarPartida() {
      gameState = {
        board: [
          ['r','n','b','q','k','b','n','r'],
          ['p','p','p','p','p','p','p','p'],
          ['','','','','','','',''],
          ['','','','','','','',''],
          ['','','','','','','',''],
          ['','','','','','','',''],
          ['P','P','P','P','P','P','P','P'],
          ['R','N','B','Q','K','B','N','R']
        ],
        turn: 'w',
        castling: { w: { k: true, q: true }, b: { k: true, q: true } },
        enPassant: null,
        history: []
      };
      isGameOver = false;
      selectedSquare = null;
      validMoves = [];
      statusElem.textContent = playerColor === 'w' ? "Tu turno" : "Pensando...";
      renderBoard();
      autoGuardarSlot();

      // Si el usuario eligió Negras, la IA inicia como Blancas
      if (playerColor === 'b') {
        setTimeout(turnoIA, 400);
      }
    }

    function setDiff(lvl) {
      difficulty = lvl;
      document.querySelectorAll(".lvl-btn").forEach((b, idx) => {
        b.classList.toggle("active", idx + 1 === lvl);
      });
      autoGuardarSlot();
    }

    // --- GUARDADO MULTIPARTIDA ---
    function autoGuardarSlot() {
      const data = {
        gameState,
        playerColor,
        difficulty,
        date: new Date().toLocaleDateString('es-CO', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' })
      };
      localStorage.setItem(`kora_chess_slot_${currentSlot}`, JSON.stringify(data));
      actualizarInfoSlots();
    }

    function guardarRanura(num) {
      currentSlot = num;
      slotIndicator.textContent = `Partida ${currentSlot}`;
      autoGuardarSlot();
      cerrarModal();
    }

    function cargarRanura(num) {
      const saved = localStorage.getItem(`kora_chess_slot_${num}`);
      if (saved) {
        const data = JSON.parse(saved);
        gameState = data.gameState;
        playerColor = data.playerColor || 'w';
        setDiff(data.difficulty || 1);
        currentSlot = num;
        slotIndicator.textContent = `Partida ${currentSlot}`;
        document.getElementById('btn-w').classList.toggle('active', playerColor === 'w');
        document.getElementById('btn-b').classList.toggle('active', playerColor === 'b');
        selectedSquare = null;
        validMoves = [];
        isGameOver = false;
        checkGameStateEnd();
        renderBoard();
        cerrarModal();
      } else {
        alert("Esta ranura aún está vacía.");
      }
    }

    function actualizarInfoSlots() {
      for (let i = 1; i <= 3; i++) {
        const elem = document.getElementById(`info-slot-${i}`);
        const saved = localStorage.getItem(`kora_chess_slot_${i}`);
        if (saved) {
          const data = JSON.parse(saved);
          elem.textContent = `Guardada: ${data.date || 'Reciente'}`;
        } else {
          elem.textContent = "Vacía";
        }
      }
    }

    function abrirModal() {
      actualizarInfoSlots();
      document.getElementById('slots-modal').style.display = 'flex';
    }

    function cerrarModal() {
      document.getElementById('slots-modal').style.display = 'none';
    }

    // Cargar ranura inicial si existe
    const slotInicial = localStorage.getItem('kora_chess_slot_1');
    if (slotInicial) {
      try {
        const data = JSON.parse(slotInicial);
        gameState = data.gameState;
        playerColor = data.playerColor || 'w';
        setDiff(data.difficulty || 1);
        document.getElementById('btn-w').classList.toggle('active', playerColor === 'w');
        document.getElementById('btn-b').classList.toggle('active', playerColor === 'b');
      } catch (e) {}
    }

    renderBoard();
    checkGameStateEnd();
    actualizarInfoSlots();
  </script>
</body>
</html>
