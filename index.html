<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#23140a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Ajedrez Clásico</title>
  
  <link rel="manifest" href="./manifest.json">

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
      margin: 0;
      padding: 0;
    }

    body {
      background: radial-gradient(circle at center, #2e1c10 0%, #120904 100%);
      color: #f7e7ce;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      min-height: 100vh;
      min-height: 100dvh;
      padding: env(safe-area-inset-top, 6px) 6px env(safe-area-inset-bottom, 6px) 6px;
      gap: 4px;
    }

    header {
      width: 100%;
      max-width: 420px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 12px;
      background: rgba(43, 27, 17, 0.95);
      border: 1px solid #633f24;
      border-radius: 8px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.5);
    }

    .status-text {
      font-size: 1rem;
      font-weight: bold;
      color: #ffebcd;
    }

    .status-sub {
      font-size: 0.72rem;
      color: #c49c74;
    }

    .btn-header {
      background: #4a2813;
      color: #fff;
      border: 1px solid #8d562c;
      padding: 6px 10px;
      border-radius: 6px;
      font-weight: bold;
      font-size: 0.8rem;
      cursor: pointer;
    }

    #install-banner {
      display: none;
      width: 100%;
      max-width: 420px;
      background: #2e7d32;
      color: #ffffff;
      padding: 8px;
      border-radius: 6px;
      text-align: center;
      font-weight: bold;
      font-size: 0.85rem;
      cursor: pointer;
      border: 1px solid #4caf50;
    }

    #board-frame {
      width: 100%;
      max-width: 420px;
      aspect-ratio: 1 / 1;
      background: linear-gradient(135deg, #422515, #221209);
      padding: 6px;
      border-radius: 10px;
      border: 3px solid #6b4021;
      box-shadow: 0 8px 20px rgba(0,0,0,0.8), inset 0 0 10px rgba(0,0,0,0.7);
    }

    #board {
      width: 100%;
      height: 100%;
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      grid-template-rows: repeat(8, 1fr);
      border: 2px solid #1a0e07;
      border-radius: 4px;
      overflow: hidden;
    }

    .square {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(26px, 8.8vw, 42px);
      line-height: 1;
      cursor: pointer;
      position: relative;
    }

    .light { background-color: #eed9b3; }
    .dark { background-color: #9c6c44; }
    .selected { background-color: #7fac72 !important; }
    .in-check { background-color: #c94a4a !important; }

    .hint::after {
      content: "";
      width: 26%;
      height: 26%;
      background: rgba(46, 125, 50, 0.75);
      border-radius: 50%;
      position: absolute;
    }

    .hint.capture::after {
      width: 72%;
      height: 72%;
      background: transparent;
      border: 3px solid rgba(211, 47, 47, 0.85);
      border-radius: 50%;
    }

    .panel-config {
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .row-controls {
      display: flex;
      width: 100%;
      gap: 6px;
    }

    .color-picker {
      display: flex;
      flex: 1;
      background: #2b180d;
      border: 1px solid #57331c;
      border-radius: 6px;
      overflow: hidden;
    }

    .color-btn {
      flex: 1;
      padding: 7px 4px;
      background: transparent;
      color: #cfb39b;
      border: none;
      font-size: 0.82rem;
      font-weight: bold;
      cursor: pointer;
      text-align: center;
    }

    .color-btn.active {
      background: #8b4513;
      color: #fff;
    }

    .controls-diff {
      display: flex;
      width: 100%;
      gap: 4px;
    }

    .lvl-btn {
      flex: 1;
      padding: 7px 0;
      background: #2b180d;
      color: #cfb39b;
      border: 1px solid #57331c;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: bold;
      cursor: pointer;
      text-align: center;
    }

    .lvl-btn.active {
      background: #8b4513;
      color: #ffffff;
      border-color: #ff9800;
    }

    .actions {
      width: 100%;
      max-width: 420px;
      display: flex;
      gap: 8px;
    }

    .btn {
      flex: 1;
      padding: 10px;
      background: linear-gradient(180deg, #61361c, #3d2010);
      color: #ffffff;
      border: 1px solid #94572e;
      border-radius: 8px;
      font-size: 0.92rem;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 3px 5px rgba(0,0,0,0.4);
    }

    .btn:active { transform: translateY(2px); }

    /* MODAL */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.85);
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .modal-content {
      background: #2a170d;
      border: 2px solid #8d562c;
      border-radius: 12px;
      max-width: 380px;
      width: 100%;
      padding: 16px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.9);
    }

    .modal-title {
      font-size: 1.15rem;
      font-weight: bold;
      color: #ffebcd;
      margin-bottom: 12px;
    }

    .slot-card {
      background: #1c0e07;
      border: 1px solid #57331c;
      border-radius: 6px;
      padding: 8px;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .slot-info { text-align: left; }
    .slot-info h4 { font-size: 0.9rem; color: #ffca80; }
    .slot-info p { font-size: 0.75rem; color: #b89b82; }

    .btn-slot {
      padding: 6px 10px;
      font-size: 0.8rem;
      font-weight: bold;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      margin-left: 4px;
    }

    .btn-load { background: #2e7d32; color: #fff; }
    .btn-save { background: #b26a00; color: #fff; }
  </style>
</head>
<body>

  <div id="install-banner" onclick="instalarApp()">
    📲 Toca aquí para instalar el juego en tu celular
  </div>

  <header>
    <div>
      <div id="status" class="status-text">Tu turno</div>
      <div id="slot-indicator" class="status-sub">Partida 1</div>
    </div>
    <button class="btn-header" onclick="abrirModal()">💾 Partidas</button>
  </header>

  <div id="board-frame">
    <div id="board"></div>
  </div>

  <div class="panel-config">
    <div class="row-controls">
      <div class="color-picker">
        <button id="btn-w" class="color-btn active" onclick="cambiarColorJugador('w')">Blancas (Mueves tú)</button>
        <button id="btn-b" class="color-btn" onclick="cambiarColorJugador('b')">Negras (Mueve IA)</button>
      </div>
    </div>
    <div class="controls-diff">
      <button class="lvl-btn active" onclick="setDiff(1)">Fácil</button>
      <button class="lvl-btn" onclick="setDiff(2)">Medio</button>
      <button class="lvl-btn" onclick="setDiff(3)">Difícil</button>
      <button class="lvl-btn" onclick="setDiff(4)">Maestro</button>
    </div>
  </div>

  <div class="actions">
    <button class="btn" onclick="deshacer()">↩ Deshacer</button>
    <button class="btn" onclick="reiniciarPartida()">🔄 Nueva Partida</button>
  </div>

  <div id="slots-modal" class="modal">
    <div class="modal-content">
      <div class="modal-title">Gestión de Partidas</div>
      
      <div class="slot-card">
        <div class="slot-info">
          <h4>Partida 1</h4>
          <p id="info-slot-1">Vacía</p>
        </div>
        <div>
          <button class="btn-slot btn-save" onclick="guardarRanura(1)">Guardar</button>
          <button class="btn-slot btn-load" onclick="cargarRanura(1)">Cargar</button>
        </div>
      </div>

      <div class="slot-card">
        <div class="slot-info">
          <h4>Partida 2</h4>
          <p id="info-slot-2">Vacía</p>
        </div>
        <div>
          <button class="btn-slot btn-save" onclick="guardarRanura(2)">Guardar</button>
          <button class="btn-slot btn-load" onclick="cargarRanura(2)">Cargar</button>
        </div>
      </div>

      <div class="slot-card">
        <div class="slot-info">
          <h4>Partida 3</h4>
          <p id="info-slot-3">Vacía</p>
        </div>
        <div>
          <button class="btn-slot btn-save" onclick="guardarRanura(3)">Guardar</button>
          <button class="btn-slot btn-load" onclick="cargarRanura(3)">Cargar</button>
        </div>
      </div>

      <button class="btn" style="margin-top: 8px; width: 100%;" onclick="cerrarModal()">Cerrar</button>
    </div>
  </div>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      });
    }

    let deferredPrompt = null;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      document.getElementById('install-banner').style.display = 'block';
    });

    function instalarApp() {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        deferredPrompt.userChoice.then(() => {
          document.getElementById('install-banner').style.display = 'none';
          deferredPrompt = null;
        });
      }
    }

    // Audio Sintético
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let actx = null;
    function playSound(isCapture) {
      try {
        if (!actx) actx = new AudioCtx();
        if (actx.state === 'suspended') actx.resume();
        const osc = actx.createOscillator();
        const gain = actx.createGain();
        osc.frequency.setValueAtTime(isCapture ? 120 : 210, actx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(30, actx.currentTime + 0.08);
        gain.gain.setValueAtTime(0.35, actx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, actx.currentTime + 0.08);
        osc.connect(gain);
        gain.connect(actx.destination);
        osc.start();
        osc.stop(actx.currentTime + 0.08);
      } catch (e) {}
    }

    const SYMBOLS = {
      'r': '♜', 'n': '♞', 'b': '♝', 'q': '♛', 'k': '♚', 'p': '♟',
      'R': '♖', 'N': '♘', 'B': '♗', 'Q': '♕', 'K': '♔', 'P': '♙'
    };

    const PIECE_VALS = { 'p': 100, 'n': 320, 'b': 330, 'r': 500, 'q': 900, 'k': 20000 };

    // Tablas PeSTO comprimidas en array lineal de 64 posiciones
    const PST = {
      p: [
        0,  0,  0,  0,  0,  0,  0,  0,
        50, 50, 50, 50, 50, 50, 50, 50,
        10, 10, 20, 30, 30, 20, 10, 10,
        5,  5, 10, 25, 25, 10,  5,  5,
        0,  0,  0, 20, 20,  0,  0,  0,
        5, -5,-10,  0,  0,-10, -5,  5,
        5, 10, 10,-20,-20, 10, 10,  5,
        0,  0,  0,  0,  0,  0,  0,  0
      ],
      n: [
        -50,-40,-30,-30,-30,-30,-40,-50,
        -40,-20,  0,  0,  0,  0,-20,-40,
        -30,  0, 10, 15, 15, 10,  0,-30,
        -30,  5, 15, 20, 20, 15,  5,-30,
        -30,  0, 15, 20, 20, 15,  0,-30,
        -30,  5, 10, 15, 15, 10,  5,-30,
        -40,-20,  0,  5,  5,  0,-20,-40,
        -50,-40,-30,-30,-30,-30,-40,-50
      ],
      b: [
        -20,-10,-10,-10,-10,-10,-10,-20,
        -10,  0,  0,  0,  0,  0,  0,-10,
        -10,  0,  5, 10, 10,  5,  0,-10,
        -10,  5,  5, 10, 10,  5,  5,-10,
        -10,  0, 10, 10, 10, 10,  0,-10,
        -10, 10, 10, 10, 10, 10, 10,-10,
        -10,  5,  0,  0,  0,  0,  5,-10,
        -20,-10,-10,-10,-10,-10,-10,-20
      ],
      r: [
        0,  0,  0,  0,  0,  0,  0,  0,
        5, 10, 10, 10, 10, 10, 10,  5,
        -5,  0,  0,  0,  0,  0,  0, -5,
        -5,  0,  0,  0,  0,  0,  0, -5,
        -5,  0,  0,  0,  0,  0,  0, -5,
        -5,  0,  0,  0,  0,  0,  0, -5,
        -5,  0,  0,  0,  0,  0,  0, -5,
        0,  0,  0,  5,  5,  0,  0,  0
      ],
      q: [
        -20,-10,-10, -5, -5,-10,-10,-20,
        -10,  0,  0,  0,  0,  0,  0,-10,
        -10,  0,  5,  5,  5,  5,  0,-10,
        -5,  0,  5,  5,  5,  5,  0, -5,
        0,  0,  5,  5,  5,  5,  0, -5,
        -10,  5,  5,  5,  5,  5,  0,-10,
        -10,  0,  5,  0,  0,  0,  0,-10,
        -20,-10,-10, -5, -5,-10,-10,-20
      ],
      k: [
        -30,-40,-40,-50,-50,-40,-40,-30,
        -30,-40,-40,-50,-50,-40,-40,-30,
        -30,-40,-40,-50,-50,-40,-40,-30,
        -30,-40,-40,-50,-50,-40,-40,-30,
        -20,-30,-30,-40,-40,-30,-30,-20,
        -10,-20,-20,-20,-20,-20,-20,-10,
        20, 20,  0,  0,  0,  0, 20, 20,
        20, 30, 10,  0,  0, 10, 30, 20
      ]
    };

    // Estado inicial en array 64 (0..63)
    const INITIAL_BOARD_64 = [
      'r','n','b','q','k','b','n','r',
      'p','p','p','p','p','p','p','p',
      '','','','','','','','',
      '','','','','','','','',
      '','','','','','','','',
      '','','','','','','','',
      'P','P','P','P','P','P','P','P',
      'R','N','B','Q','K','B','N','R'
    ];

    let gameState = {
      board: [...INITIAL_BOARD_64],
      turn: 'w',
      castling: { wK: true, wQ: true, bK: true, bQ: true },
      enPassant: -1,
      history: []
    };

    let playerColor = 'w';
    let difficulty = 1;
    let selectedSq = -1;
    let validMoves = [];
    let isGameOver = false;
    let isAiThinking = false;
    let currentSlot = 1;

    const boardElem = document.getElementById("board");
    const statusElem = document.getElementById("status");
    const slotIndicator = document.getElementById("slot-indicator");

    function isWhite(p) { return p !== '' && p === p.toUpperCase(); }
    function isBlack(p) { return p !== '' && p === p.toLowerCase(); }
    function pieceColor(p) { return !p ? null : (isWhite(p) ? 'w' : 'b'); }

    // Generador atómico de ataques sin clonaciones (Ultra-rápido)
    function isSquareAttacked(sq, byColor, board) {
      const isW = (byColor === 'w');
      const r = (sq >> 3), c = sq & 7;

      // Ataques de peón
      const pawnOffset = isW ? 8 : -8;
      if (c > 0) {
        const fromSq = sq + pawnOffset - 1;
        if (fromSq >= 0 && fromSq < 64 && board[fromSq] === (isW ? 'P' : 'p')) return true;
      }
      if (c < 7) {
        const fromSq = sq + pawnOffset + 1;
        if (fromSq >= 0 && fromSq < 64 && board[fromSq] === (isW ? 'P' : 'p')) return true;
      }

      // Caballos
      const knightOffsets = [-17, -15, -10, -6, 6, 10, 15, 17];
      for (const off of knightOffsets) {
        const to = sq + off;
        if (to >= 0 && to < 64) {
          const tr = to >> 3, tc = to & 7;
          if (Math.abs(r - tr) <= 2 && Math.abs(c - tc) <= 2 && Math.abs(r - tr) + Math.abs(c - tc) === 3) {
            if (board[to] === (isW ? 'N' : 'n')) return true;
          }
        }
      }

      // Rey
      for (let dr = -1; dr <= 1; dr++) {
        for (let dc = -1; dc <= 1; dc++) {
          if (dr === 0 && dc === 0) continue;
          const nr = r + dr, nc = c + dc;
          if (nr >= 0 && nr < 8 && nc >= 0 && nc < 8) {
            if (board[(nr << 3) + nc] === (isW ? 'K' : 'k')) return true;
          }
        }
      }

      // Torres, Alfiles, Damas (Rayos)
      const rayDirs = [
        [-1,0,true,false],[1,0,true,false],[0,-1,true,false],[0,1,true,false],
        [-1,-1,false,true],[-1,1,false,true],[1,-1,false,true],[1,1,false,true]
      ];

      for (const [dr, dc, isOrth, isDiag] of rayDirs) {
        let cr = r + dr, cc = c + dc;
        while (cr >= 0 && cr < 8 && cc >= 0 && cc < 8) {
          const idx = (cr << 3) + cc;
          const p = board[idx];
          if (p) {
            if (pieceColor(p) === byColor) {
              const t = p.toLowerCase();
              if (t === 'q' || (isOrth && t === 'r') || (isDiag && t === 'b')) return true;
            }
            break;
          }
          cr += dr;
          cc += dc;
        }
      }

      return false;
    }

    function getKingSquare(board, color) {
      const target = (color === 'w' ? 'K' : 'k');
      for (let i = 0; i < 64; i++) {
        if (board[i] === target) return i;
      }
      return -1;
    }

    function isKingInCheck(board, color) {
      const ksq = getKingSquare(board, color);
      if (ksq === -1) return false;
      return isSquareAttacked(ksq, color === 'w' ? 'b' : 'w', board);
    }

    // Generador de jugadas legales
    function getLegalMoves(state, color) {
      const moves = [];
      const b = state.board;
      const isW = (color === 'w');
      const opp = isW ? 'b' : 'w';

      for (let sq = 0; sq < 64; sq++) {
        const p = b[sq];
        if (!p || pieceColor(p) !== color) continue;
        const type = p.toLowerCase();
        const r = sq >> 3, c = sq & 7;

        // PEONES
        if (type === 'p') {
          const fwd = isW ? -8 : 8;
          const startR = isW ? 6 : 1;
          const promoR = isW ? 0 : 7;
          const to1 = sq + fwd;

          if (to1 >= 0 && to1 < 64 && b[to1] === '') {
            moves.push({ from: sq, to: to1, promo: (to1 >> 3) === promoR });
            const to2 = sq + fwd * 2;
            if (r === startR && b[to2] === '') {
              moves.push({ from: sq, to: to2, doublePawn: true });
            }
          }

          // Capturas
          for (const dc of [-1, 1]) {
            const tc = c + dc;
            if (tc >= 0 && tc < 8) {
              const toC = sq + fwd + dc;
              if (toC >= 0 && toC < 64) {
                if (b[toC] && pieceColor(b[toC]) === opp) {
                  moves.push({ from: sq, to: toC, promo: (toC >> 3) === promoR });
                } else if (toC === state.enPassant) {
                  moves.push({ from: sq, to: toC, enPassant: true });
                }
              }
            }
          }
        }

        // CABALLOS
        else if (type === 'n') {
          const knightJumps = [-17, -15, -10, -6, 6, 10, 15, 17];
          for (const off of knightJumps) {
            const to = sq + off;
            if (to >= 0 && to < 64) {
              const tr = to >> 3, tc = to & 7;
              if (Math.abs(r - tr) <= 2 && Math.abs(c - tc) <= 2 && Math.abs(r - tr) + Math.abs(c - tc) === 3) {
                if (!b[to] || pieceColor(b[to]) === opp) moves.push({ from: sq, to });
              }
            }
          }
        }

        // TORRE, ALFIL, DAMA
        else if (type === 'b' || type === 'r' || type === 'q') {
          const dirs = [];
          if (type === 'b' || type === 'q') dirs.push([-1,-1],[-1,1],[1,-1],[1,1]);
          if (type === 'r' || type === 'q') dirs.push([-1,0],[1,0],[0,-1],[0,1]);

          for (const [dr, dc] of dirs) {
            let cr = r + dr, cc = c + dc;
            while (cr >= 0 && cr < 8 && cc >= 0 && cc < 8) {
              const to = (cr << 3) + cc;
              if (!b[to]) {
                moves.push({ from: sq, to });
              } else {
                if (pieceColor(b[to]) === opp) moves.push({ from: sq, to });
                break;
              }
              cr += dr;
              cc += dc;
            }
          }
        }

        // REY
        else if (type === 'k') {
          for (let dr = -1; dr <= 1; dr++) {
            for (let dc = -1; dc <= 1; dc++) {
              if (dr === 0 && dc === 0) continue;
              const nr = r + dr, nc = c + dc;
              if (nr >= 0 && nr < 8 && nc >= 0 && nc < 8) {
                const to = (nr << 3) + nc;
                if (!b[to] || pieceColor(b[to]) === opp) moves.push({ from: sq, to });
              }
            }
          }

          // Enroques
          if (isW && sq === 60) {
            if (state.castling.wK && !b[61] && !b[62] && !isSquareAttacked(60, 'b', b) && !isSquareAttacked(61, 'b', b) && !isSquareAttacked(62, 'b', b)) {
              moves.push({ from: 60, to: 62, castleK: true });
            }
            if (state.castling.wQ && !b[59] && !b[58] && !b[57] && !isSquareAttacked(60, 'b', b) && !isSquareAttacked(59, 'b', b) && !isSquareAttacked(58, 'b', b)) {
              moves.push({ from: 60, to: 58, castleQ: true });
            }
          } else if (!isW && sq === 4) {
            if (state.castling.bK && !b[5] && !b[6] && !isSquareAttacked(4, 'w', b) && !isSquareAttacked(5, 'w', b) && !isSquareAttacked(6, 'w', b)) {
              moves.push({ from: 4, to: 6, castleK: true });
            }
            if (state.castling.bQ && !b[3] && !b[2] && !b[1] && !isSquareAttacked(4, 'w', b) && !isSquareAttacked(3, 'w', b) && !isSquareAttacked(2, 'w', b)) {
              moves.push({ from: 4, to: 2, castleQ: true });
            }
          }
        }
      }

      // Filtrar jugadas que dejen en jaque al rey (Legalidad absoluta FIDE)
      const valid = [];
      for (const m of moves) {
        const nextB = makeMoveSimulated(b, m, color);
        if (!isKingInCheck(nextB, color)) {
          valid.push(m);
        }
      }
      return valid;
    }

    function makeMoveSimulated(board, m, color) {
      const nb = [...board];
      const p = nb[m.from];
      nb[m.to] = m.promo ? (color === 'w' ? 'Q' : 'q') : p;
      nb[m.from] = '';

      if (m.castleK) {
        if (color === 'w') { nb[61] = 'R'; nb[63] = ''; }
        else { nb[5] = 'r'; nb[7] = ''; }
      }
      if (m.castleQ) {
        if (color === 'w') { nb[59] = 'R'; nb[56] = ''; }
        else { nb[3] = 'r'; nb[0] = ''; }
      }
      if (m.enPassant) {
        const pawnSq = color === 'w' ? m.to + 8 : m.to - 8;
        nb[pawnSq] = '';
      }
      return nb;
    }

    function applyMoveToState(state, m) {
      const p = state.board[m.from];
      const color = state.turn;
      const nextBoard = makeMoveSimulated(state.board, m, color);

      const nextCastling = { ...state.castling };
      if (p === 'K') { nextCastling.wK = false; nextCastling.wQ = false; }
      if (p === 'k') { nextCastling.bK = false; nextCastling.bQ = false; }
      if (m.from === 63 || m.to === 63) nextCastling.wK = false;
      if (m.from === 56 || m.to === 56) nextCastling.wQ = false;
      if (m.from === 7 || m.to === 7) nextCastling.bK = false;
      if (m.from === 0 || m.to === 0) nextCastling.bQ = false;

      const nextEp = m.doublePawn ? (color === 'w' ? m.from - 8 : m.from + 8) : -1;

      return {
        board: nextBoard,
        turn: color === 'w' ? 'b' : 'w',
        castling: nextCastling,
        enPassant: nextEp,
        history: state.history
      };
    }

    // --- RENDERIZADO VISUAL ---
    function renderBoard() {
      boardElem.innerHTML = '';
      const inCheck = isKingInCheck(gameState.board, gameState.turn);
      const ksq = inCheck ? getKingSquare(gameState.board, gameState.turn) : -1;

      for (let i = 0; i < 64; i++) {
        const sq = playerColor === 'w' ? i : 63 - i;
        const r = sq >> 3, c = sq & 7;

        const cell = document.createElement("div");
        cell.className = `square ${(r + c) % 2 === 0 ? 'light' : 'dark'}`;

        const piece = gameState.board[sq];
        if (piece) {
          cell.textContent = SYMBOLS[piece];
          cell.style.color = isWhite(piece) ? '#ffffff' : '#140c06';
          cell.style.textShadow = isWhite(piece) ? '0 1px 3px #000' : '0 1px 1px rgba(255,255,255,0.4)';
        }

        if (sq === ksq) cell.classList.add("in-check");
        if (sq === selectedSq) cell.classList.add("selected");

        const move = validMoves.find(m => m.to === sq);
        if (move) {
          cell.classList.add("hint");
          if (gameState.board[sq] !== '' || move.enPassant) cell.classList.add("capture");
        }

        cell.addEventListener("click", () => handleSquareClick(sq));
        boardElem.appendChild(cell);
      }
    }

    function handleSquareClick(sq) {
      if (isGameOver || isAiThinking || gameState.turn !== playerColor) return;
      const piece = gameState.board[sq];

      if (selectedSq !== -1) {
        const move = validMoves.find(m => m.to === sq);
        if (move) {
          ejecutarJugada(move);
          selectedSq = -1;
          validMoves = [];
          renderBoard();
          const fin = checkGameEnd();
          if (!fin && gameState.turn !== playerColor) {
            triggerTurnoIA();
          }
          return;
        }
      }

      if (piece && pieceColor(piece) === playerColor) {
        selectedSq = sq;
        const legal = getLegalMoves(gameState, playerColor);
        validMoves = legal.filter(m => m.from === sq);
        renderBoard();
      } else {
        selectedSq = -1;
        validMoves = [];
        renderBoard();
      }
    }

    function ejecutarJugada(move) {
      const isCapture = (gameState.board[move.to] !== '' || move.enPassant);
      gameState.history.push({
        board: [...gameState.board],
        turn: gameState.turn,
        castling: { ...gameState.castling },
        enPassant: gameState.enPassant
      });
      gameState = applyMoveToState(gameState, move);
      playSound(isCapture);
      autoGuardarSlot();
    }

    function checkGameEnd() {
      const legal = getLegalMoves(gameState, gameState.turn);
      const inCheck = isKingInCheck(gameState.board, gameState.turn);

      if (legal.length === 0) {
        isGameOver = true;
        if (inCheck) {
          const winner = gameState.turn === 'w' ? 'Negras' : 'Blancas';
          statusElem.textContent = `¡Jaque Mate! Ganan ${winner}`;
        } else {
          statusElem.textContent = "Tablas por Rey Ahogado";
        }
        return true;
      }

      if (inCheck) {
        statusElem.textContent = `¡Jaque a las ${gameState.turn === 'w' ? 'Blancas' : 'Negras'}!`;
      } else {
        statusElem.textContent = (gameState.turn === playerColor) ? "Tu turno" : "Pensando...";
      }
      return false;
    }

    // --- EVALUACIÓN POSICIONAL ---
    function evaluateBoard(board) {
      let score = 0;
      for (let i = 0; i < 64; i++) {
        const p = board[i];
        if (!p) continue;
        const type = p.toLowerCase();
        const val = PIECE_VALS[type] || 0;
        const pstVal = isWhite(p) ? PST[type][i] : PST[type][63 - i];
        score += isWhite(p) ? (val + pstVal) : -(val + pstVal);
      }
      return score;
    }

    // Minimax ultra-ligero con Poda Alfa-Beta (Sin lags)
    function minimax(state, depth, alpha, beta, isMaximizing) {
      if (depth === 0) return evaluateBoard(state.board);

      const color = isMaximizing ? 'w' : 'b';
      const moves = getLegalMoves(state, color);

      if (moves.length === 0) {
        if (isKingInCheck(state.board, color)) {
          return isMaximizing ? -50000 + (3 - depth) : 50000 - (3 - depth);
        }
        return 0;
      }

      // Ordenar capturas primero para maximizar cortes alfa-beta
      moves.sort((a, b) => (state.board[b.to] ? 1 : 0) - (state.board[a.to] ? 1 : 0));

      if (isMaximizing) {
        let maxEval = -Infinity;
        for (const m of moves) {
          const next = applyMoveToState(state, m);
          const ev = minimax(next, depth - 1, alpha, beta, false);
          maxEval = Math.max(maxEval, ev);
          alpha = Math.max(alpha, ev);
          if (beta <= alpha) break;
        }
        return maxEval;
      } else {
        let minEval = Infinity;
        for (const m of moves) {
          const next = applyMoveToState(state, m);
          const ev = minimax(next, depth - 1, alpha, beta, true);
          minEval = Math.min(minEval, ev);
          beta = Math.min(beta, ev);
          if (beta <= alpha) break;
        }
        return minEval;
      }
    }

    function triggerTurnoIA() {
      if (isGameOver || isAiThinking) return;
      isAiThinking = true;
      statusElem.textContent = "Pensando...";

      // Timeout mínimo para dar paso al renderizado de la interfaz
      setTimeout(() => {
        const aiColor = playerColor === 'w' ? 'b' : 'w';
        const isAiWhite = (aiColor === 'w');
        const moves = getLegalMoves(gameState, aiColor);

        if (moves.length === 0) {
          isAiThinking = false;
          checkGameEnd();
          renderBoard();
          return;
        }

        let bestMove = null;

        if (difficulty === 1) {
          // Fácil: Selecciona jugadas seguras aleatorias
          bestMove = moves[Math.floor(Math.random() * moves.length)];
        } else if (difficulty === 2) {
          // Medio: Profundidad 1 instantánea
          let bestVal = isAiWhite ? -Infinity : Infinity;
          for (const m of moves) {
            const next = applyMoveToState(gameState, m);
            const score = evaluateBoard(next.board);
            if (isAiWhite ? score > bestVal : score < bestVal) {
              bestVal = score;
              bestMove = m;
            }
          }
        } else {
          // Difícil (depth 2) y Maestro (depth 3 con poda alfa-beta estricta)
          const depth = (difficulty === 3) ? 2 : 3;
          let bestVal = isAiWhite ? -Infinity : Infinity;
          for (const m of moves) {
            const next = applyMoveToState(gameState, m);
            const score = minimax(next, depth - 1, -Infinity, Infinity, !isAiWhite);
            if (isAiWhite ? score > bestVal : score < bestVal) {
              bestVal = score;
              bestMove = m;
            }
          }
        }

        if (bestMove) {
          ejecutarJugada(bestMove);
        }

        isAiThinking = false;
        checkGameEnd();
        renderBoard();
      }, 50);
    }

    // --- ACCIONES Y CONTROLES ---
    function cambiarColorJugador(c) {
      if (playerColor === c) return;
      playerColor = c;
      document.getElementById('btn-w').classList.toggle('active', c === 'w');
      document.getElementById('btn-b').classList.toggle('active', c === 'b');
      reiniciarPartida();
    }

    function deshacer() {
      if (isAiThinking || gameState.history.length === 0) return;
      
      // Si el turno era del jugador, deshaz jugada de IA y jugada propia
      if (gameState.history.length >= 2) {
        gameState.history.pop();
        const prev = gameState.history.pop();
        restaurarSnapshot(prev);
      } else {
        const prev = gameState.history.pop();
        restaurarSnapshot(prev);
      }

      isGameOver = false;
      selectedSq = -1;
      validMoves = [];
      checkGameEnd();
      renderBoard();
      autoGuardarSlot();
    }

    function restaurarSnapshot(snap) {
      gameState.board = [...snap.board];
      gameState.turn = snap.turn;
      gameState.castling = { ...snap.castling };
      gameState.enPassant = snap.enPassant;
    }

    function reiniciarPartida() {
      isAiThinking = false;
      isGameOver = false;
      selectedSq = -1;
      validMoves = [];

      gameState = {
        board: [...INITIAL_BOARD_64],
        turn: 'w',
        castling: { wK: true, wQ: true, bK: true, bQ: true },
        enPassant: -1,
        history: []
      };

      statusElem.textContent = (playerColor === 'w') ? "Tu turno" : "Pensando...";
      renderBoard();
      autoGuardarSlot();

      if (playerColor === 'b') {
        triggerTurnoIA();
      }
    }

    function setDiff(lvl) {
      difficulty = lvl;
      document.querySelectorAll(".lvl-btn").forEach((b, idx) => {
        b.classList.toggle("active", idx + 1 === lvl);
      });
      autoGuardarSlot();
    }

    // --- GUARDADO LOCAL ---
    function autoGuardarSlot() {
      const data = {
        gameState,
        playerColor,
        difficulty,
        date: new Date().toLocaleDateString('es-CO', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' })
      };
      localStorage.setItem(`kora_chess_slot_${currentSlot}`, JSON.stringify(data));
      actualizarInfoSlots();
    }

    function guardarRanura(num) {
      currentSlot = num;
      slotIndicator.textContent = `Partida ${currentSlot}`;
      autoGuardarSlot();
      cerrarModal();
    }

    function cargarRanura(num) {
      const saved = localStorage.getItem(`kora_chess_slot_${num}`);
      if (saved) {
        const data = JSON.parse(saved);
        gameState = data.gameState;
        playerColor = data.playerColor || 'w';
        setDiff(data.difficulty || 1);
        currentSlot = num;
        slotIndicator.textContent = `Partida ${currentSlot}`;

        document.getElementById('btn-w').classList.toggle('active', playerColor === 'w');
        document.getElementById('btn-b').classList.toggle('active', playerColor === 'b');

        selectedSq = -1;
        validMoves = [];
        isGameOver = false;
        isAiThinking = false;

        checkGameEnd();
        renderBoard();
        cerrarModal();

        if (gameState.turn !== playerColor && !isGameOver) {
          triggerTurnoIA();
        }
      } else {
        alert("Esta ranura aún está vacía.");
      }
    }

    function actualizarInfoSlots() {
      for (let i = 1; i <= 3; i++) {
        const elem = document.getElementById(`info-slot-${i}`);
        const saved = localStorage.getItem(`kora_chess_slot_${i}`);
        if (saved) {
          const data = JSON.parse(saved);
          elem.textContent = `Guardada: ${data.date || 'Reciente'}`;
        } else {
          elem.textContent = "Vacía";
        }
      }
    }

    function abrirModal() {
      actualizarInfoSlots();
      document.getElementById('slots-modal').style.display = 'flex';
    }

    function cerrarModal() {
      document.getElementById('slots-modal').style.display = 'none';
    }

    // Inicialización limpia
    const slotInicial = localStorage.getItem('kora_chess_slot_1');
    if (slotInicial) {
      try {
        const data = JSON.parse(slotInicial);
        gameState = data.gameState;
        playerColor = data.playerColor || 'w';
        setDiff(data.difficulty || 1);
        document.getElementById('btn-w').classList.toggle('active', playerColor === 'w');
        document.getElementById('btn-b').classList.toggle('active', playerColor === 'b');
      } catch (e) {}
    }

    renderBoard();
    checkGameEnd();
    actualizarInfoSlots();

    if (gameState.turn !== playerColor && !isGameOver) {
      triggerTurnoIA();
    }
  </script>
</body>
</html>
