<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#2c1d11">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Ajedrez Clásico</title>

  <!-- PWA MANIFEST INTEGRADO -->
  <link rel="manifest" href="data:application/manifest+json,{
    %22name%22:%22Ajedrez%20Cl%C3%A1sico%22,
    %22short_name%22:%22Ajedrez%22,
    %22start_url%22:%22./index.html%22,
    %22display%22:%22standalone%22,
    %22orientation%22:%22portrait%22,
    %22background_color%22:%22%231c120c%22,
    %22theme_color%22:%22%232c1d11%22,
    %22icons%22:[{
      %22src%22:%22data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%235c3a21'/><text y='75' x='15' font-size='70'>♞</text></svg>%22,
      %22sizes%22:%22192x192 512x512%22,
      %22type%22:%22image/svg+xml%22
    }]
  }">

  <style>
    * { box-sizing: border-box; user-select: none; -webkit-user-select: none; margin: 0; padding: 0; }
    body {
      background: radial-gradient(circle, #2b1b11 0%, #110a06 100%);
      color: #f5deb3;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      min-height: 100vh;
      padding: 10px;
      overflow-x: hidden;
    }
    header {
      width: 100%;
      max-width: 460px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 12px;
      background: rgba(0,0,0,0.4);
      border-radius: 10px;
      border: 1px solid #5a3d28;
    }
    .status-text { font-size: 1.1rem; font-weight: bold; color: #ffebcd; }
    .btn {
      background: linear-gradient(180deg, #8a5a36 0%, #52331c 100%);
      color: #fff;
      border: 1px solid #c89666;
      border-radius: 8px;
      padding: 8px 14px;
      font-size: 0.95rem;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 3px 6px rgba(0,0,0,0.5);
    }
    .btn:active { transform: translateY(2px); box-shadow: 0 1px 2px rgba(0,0,0,0.5); }
    
    /* TABLERO ESTILO MADERA REALISTA */
    #board-wrapper {
      width: 100%;
      max-width: 440px;
      aspect-ratio: 1 / 1;
      padding: 12px;
      background: linear-gradient(135deg, #422517, #1f110a);
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.8), inset 0 0 10px rgba(0,0,0,0.7);
      border: 3px solid #7c4c29;
    }
    #board {
      width: 100%;
      height: 100%;
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      grid-template-rows: repeat(8, 1fr);
      border: 2px solid #231209;
    }
    .square {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(34px, 10vw, 48px);
      cursor: pointer;
    }
    .light { background-color: #eed9b3; }
    .dark { background-color: #9c6c44; }
    .selected { background-color: #7fac72 !important; }
    .hint::after {
      content: "";
      width: 28%;
      height: 28%;
      background: rgba(46, 139, 87, 0.7);
      border-radius: 50%;
      position: absolute;
    }
    .hint.capture::after {
      width: 75%;
      height: 75%;
      background: transparent;
      border: 4px solid rgba(200, 30, 30, 0.7);
      border-radius: 50%;
    }

    /* CONTROLES Y NIVELES ACCESIBLES */
    .controls {
      width: 100%;
      max-width: 460px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      margin: 8px 0;
    }
    .lvl-btn {
      padding: 8px 2px;
      font-size: 0.85rem;
      background: #331f13;
      border: 1px solid #6b4324;
      color: #d1b194;
      border-radius: 6px;
      cursor: pointer;
    }
    .lvl-btn.active {
      background: #94582f;
      color: #fff;
      font-weight: bold;
      border-color: #ffc285;
    }
    .actions {
      width: 100%;
      max-width: 460px;
      display: flex;
      justify-content: space-between;
      gap: 10px;
    }
    .actions .btn { flex: 1; padding: 12px; font-size: 1rem; }
    #install-banner {
      display: none;
      width: 100%;
      max-width: 460px;
      background: #235429;
      color: #fff;
      padding: 10px;
      border-radius: 8px;
      text-align: center;
      margin-bottom: 6px;
      border: 1px solid #489e53;
      cursor: pointer;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <header>
    <div id="status" class="status-text">Tu turno (Blancas)</div>
    <div id="ai-status" style="font-size: 0.8rem; color: #ffbf80;">Listo</div>
  </header>

  <div id="install-banner" onclick="instalarApp()">
    📲 Instalar juego en el celular
  </div>

  <div id="board-wrapper">
    <div id="board"></div>
  </div>

  <div class="controls">
    <button class="lvl-btn active" onclick="setDiff(1)">Fácil</button>
    <button class="lvl-btn" onclick="setDiff(2)">Medio</button>
    <button class="lvl-btn" onclick="setDiff(3)">Difícil</button>
    <button class="lvl-btn" onclick="setDiff(4)">Maestro</button>
  </div>

  <div class="actions">
    <button class="btn" onclick="deshacer()">↩ Deshacer</button>
    <button class="btn" onclick="reiniciarPartida()">🔄 Nueva Partida</button>
  </div>

  <script>
    // --- AUDIO SINTETIZADO CON WEB AUDIO API (100% OFFLINE) ---
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let actx = null;
    function playWoodSound(capture = false) {
      if (!actx) actx = new AudioCtx();
      const osc = actx.createOscillator();
      const gain = actx.createGain();
      osc.type = capture ? "sawtooth" : "triangle";
      osc.frequency.setValueAtTime(capture ? 140 : 220, actx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(30, actx.currentTime + 0.08);
      gain.gain.setValueAtTime(0.4, actx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, actx.currentTime + 0.08);
      osc.connect(gain);
      gain.connect(actx.destination);
      osc.start();
      osc.stop(actx.currentTime + 0.08);
    }

    // --- REPRESENTACIÓN SIMPLIFICADA DEL TABLERO ---
    const SYMBOLS = {
      'r': '♜', 'n': '♞', 'b': '♝', 'q': '♛', 'k': '♚', 'p': '♟',
      'R': '♖', 'N': '♘', 'B': '♗', 'Q': '♕', 'K': '♔', 'P': '♙'
    };

    let boardState = [
      ['r','n','b','q','k','b','n','r'],
      ['p','p','p','p','p','p','p','p'],
      ['','','','','','','',''],
      ['','','','','','','',''],
      ['','','','','','','',''],
      ['','','','','','','',''],
      ['P','P','P','P','P','P','P','P'],
      ['R','N','B','Q','K','B','N','R']
    ];

    let history = [];
    let selectedSquare = null;
    let validMoves = [];
    let difficulty = 1;
    let isGameOver = false;

    const boardElem = document.getElementById("board");
    const statusElem = document.getElementById("status");
    const aiStatusElem = document.getElementById("ai-status");

    function renderBoard() {
      boardElem.innerHTML = '';
      for (let r = 0; r < 8; r++) {
        for (let c = 0; c < 8; c++) {
          const sq = document.createElement("div");
          sq.className = `square ${(r + c) % 2 === 0 ? 'light' : 'dark'}`;
          sq.dataset.row = r;
          sq.dataset.col = c;

          const piece = boardState[r][c];
          if (piece) {
            sq.textContent = SYMBOLS[piece];
            sq.style.color = piece === piece.toUpperCase() ? '#fffbe6' : '#140c06';
            sq.style.textShadow = piece === piece.toUpperCase() ? '0 2px 4px #000' : '0 1px 2px #fff8';
          }

          if (selectedSquare && selectedSquare.r === r && selectedSquare.c === c) {
            sq.classList.add("selected");
          }

          const move = validMoves.find(m => m.r === r && m.c === c);
          if (move) {
            sq.classList.add("hint");
            if (boardState[r][c] !== '') sq.classList.add("capture");
          }

          sq.addEventListener("click", () => handleSquareClick(r, c));
          boardElem.appendChild(sq);
        }
      }
    }

    function isWhite(piece) { return piece && piece === piece.toUpperCase(); }
    function isBlack(piece) { return piece && piece === piece.toLowerCase(); }

    function getBasicMoves(r, c, state) {
      const p = state[r][c];
      const moves = [];
      const white = isWhite(p);
      const enemyCheck = white ? isBlack : isWhite;

      // Peones simplificados
      if (p.toLowerCase() === 'p') {
        const dir = white ? -1 : 1;
        if (state[r + dir] && state[r + dir][c] === '') {
          moves.push({ r: r + dir, c: c });
          if ((white && r === 6) || (!white && r === 1)) {
            if (state[r + dir * 2][c] === '') moves.push({ r: r + dir * 2, c: c });
          }
        }
        [-1, 1].forEach(dc => {
          if (state[r + dir] && enemyCheck(state[r + dir][c + dc])) {
            moves.push({ r: r + dir, c: c + dc });
          }
        });
      }

      // Caballos
      if (p.toLowerCase() === 'n') {
        [[-2,-1],[-2,1],[-1,-2],[-1,2],[1,-2],[1,2],[2,-1],[2,1]].forEach(([dr, dc]) => {
          const nr = r + dr, nc = c + dc;
          if (nr >= 0 && nr < 8 && nc >= 0 && nc < 8) {
            if (state[nr][nc] === '' || enemyCheck(state[nr][nc])) moves.push({ r: nr, c: nc });
          }
        });
      }

      // Rayas (Torre, Alfil, Reina)
      const dirs = [];
      if (['r', 'q'].includes(p.toLowerCase())) dirs.push([-1,0],[1,0],[0,-1],[0,1]);
      if (['b', 'q'].includes(p.toLowerCase())) dirs.push([-1,-1],[-1,1],[1,-1],[1,1]);

      dirs.forEach(([dr, dc]) => {
        let step = 1;
        while (true) {
          const nr = r + dr * step, nc = c + dc * step;
          if (nr < 0 || nr >= 8 || nc < 0 || nc >= 8) break;
          if (state[nr][nc] === '') {
            moves.push({ r: nr, c: nc });
          } else {
            if (enemyCheck(state[nr][nc])) moves.push({ r: nr, c: nc });
            break;
          }
          step++;
        }
      });

      // Rey
      if (p.toLowerCase() === 'k') {
        for (let dr = -1; dr <= 1; dr++) {
          for (let dc = -1; dc <= 1; dc++) {
            if (dr === 0 && dc === 0) continue;
            const nr = r + dr, nc = c + dc;
            if (nr >= 0 && nr < 8 && nc >= 0 && nc < 8) {
              if (state[nr][nc] === '' || enemyCheck(state[nr][nc])) moves.push({ r: nr, c: nc });
            }
          }
        }
      }
      return moves;
    }

    function handleSquareClick(r, c) {
      if (isGameOver) return;
      const piece = boardState[r][c];

      if (selectedSquare) {
        const move = validMoves.find(m => m.r === r && m.c === c);
        if (move) {
          ejecutarMovimiento(selectedSquare.r, selectedSquare.c, r, c);
          selectedSquare = null;
          validMoves = [];
          renderBoard();
          setTimeout(turnoIA, 350);
          return;
        }
      }

      if (isWhite(piece)) {
        selectedSquare = { r, c };
        validMoves = getBasicMoves(r, c, boardState);
        renderBoard();
      } else {
        selectedSquare = null;
        validMoves = [];
        renderBoard();
      }
    }

    function ejecutarMovimiento(fr, fc, tr, tc) {
      history.push(JSON.parse(JSON.stringify(boardState)));
      const captured = boardState[tr][tc] !== '';
      boardState[tr][tc] = boardState[fr][fc];
      boardState[fr][fc] = '';

      // Promoción básica a dama
      if (boardState[tr][tc] === 'P' && tr === 0) boardState[tr][tc] = 'Q';
      if (boardState[tr][tc] === 'p' && tr === 7) boardState[tr][tc] = 'q';

      playWoodSound(captured);
    }

    function deshacer() {
      if (history.length > 0) {
        boardState = history.pop();
        selectedSquare = null;
        validMoves = [];
        isGameOver = false;
        statusElem.textContent = "Tu turno (Blancas)";
        renderBoard();
      }
    }

    function reiniciarPartida() {
      boardState = [
        ['r','n','b','q','k','b','n','r'],
        ['p','p','p','p','p','p','p','p'],
        ['','','','','','','',''],
        ['','','','','','','',''],
        ['','','','','','','',''],
        ['','','','','','','',''],
        ['P','P','P','P','P','P','P','P'],
        ['R','N','B','Q','K','B','N','R']
      ];
      history = [];
      selectedSquare = null;
      validMoves = [];
      isGameOver = false;
      statusElem.textContent = "Tu turno (Blancas)";
      renderBoard();
    }

    function setDiff(lvl) {
      difficulty = lvl;
      document.querySelectorAll(".lvl-btn").forEach((b, idx) => {
        b.classList.toggle("active", idx + 1 === lvl);
      });
    }

    // --- IA DE DIFICULTADES ESCALONADAS ---
    function turnoIA() {
      aiStatusElem.textContent = "Pensando...";
      statusElem.textContent = "Turno de las Negras...";

      setTimeout(() => {
        const allMoves = [];
        for (let r = 0; r < 8; r++) {
          for (let c = 0; c < 8; c++) {
            if (isBlack(boardState[r][c])) {
              const moves = getBasicMoves(r, c, boardState);
              moves.forEach(m => allMoves.push({ fr: r, fc: c, tr: m.r, tc: m.c }));
            }
          }
        }

        if (allMoves.length === 0) {
          statusElem.textContent = "¡Jaque Mate! Ganaste.";
          isGameOver = true;
          return;
        }

        let chosenMove;
        if (difficulty === 1) {
          // Fácil: Aleatorio
          chosenMove = allMoves[Math.floor(Math.random() * allMoves.length)];
        } else {
          // Busca capturar piezas de mayor valor
          const pieceVals = { 'p': 10, 'n': 30, 'b': 30, 'r': 50, 'q': 90, 'k': 900 };
          allMoves.sort((a, b) => {
            const valA = boardState[a.tr][a.tc] ? (pieceVals[boardState[a.tr][a.tc].toLowerCase()] || 0) : 0;
            const valB = boardState[b.tr][b.tc] ? (pieceVals[boardState[b.tr][b.tc].toLowerCase()] || 0) : 0;
            return valB - valA;
          });
          chosenMove = (difficulty > 2 && allMoves[0].val > 0) ? allMoves[0] : allMoves[Math.floor(Math.random() * Math.min(3, allMoves.length))];
        }

        ejecutarMovimiento(chosenMove.fr, chosenMove.fc, chosenMove.tr, chosenMove.tc);
        aiStatusElem.textContent = "Listo";
        statusElem.textContent = "Tu turno (Blancas)";
        renderBoard();
      }, 300);
    }

    // --- INSTALACIÓN PWA NATIVA ---
    let deferredPrompt;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      document.getElementById('install-banner').style.display = 'block';
    });

    function instalarApp() {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        deferredPrompt.userChoice.then(() => {
          document.getElementById('install-banner').style.display = 'none';
          deferredPrompt = null;
        });
      }
    }

    // Registrar Service Worker virtual en memoria
    if ('serviceWorker' in navigator) {
      const swCode = `self.addEventListener('fetch', function(e) {});`;
      const blob = new Blob([swCode], { type: 'application/javascript' });
      navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(() => {});
    }

    renderBoard();
  </script>
</body>
</html>
